name: Windows Fast Install Review

on:
  push:
    branches:
      - codex/agent-key-only-install

permissions:
  contents: read

jobs:
  powershell-bootstrap:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts
        shell: powershell
        run: |
          $Files = @(
            "install.ps1",
            "scripts/bootstrap-agent-install.ps1",
            "tests/test-install-key-only.ps1",
            "tests/test-agent-bootstrap.ps1"
          )
          foreach ($File in $Files) {
            $Errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $File),
              [ref]$null,
              [ref]$Errors
            )
            if ($Errors.Count -ne 0) {
              throw "$File has parser errors: $($Errors | Out-String)"
            }
          }
      - name: Test PowerShell bootstrap
        shell: powershell
        run: .\tests\test-agent-bootstrap.ps1
