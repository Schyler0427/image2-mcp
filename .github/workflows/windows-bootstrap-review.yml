name: Windows Bootstrap Review

on:
  push:
    branches:
      - codex/agent-key-only-install

permissions:
  contents: read

jobs:
  powershell-51-review:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell sources with Windows PowerShell 5.1
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)"
          }

          $paths = @(
            "install.ps1",
            "scripts/bootstrap-agent-install.ps1",
            "scripts/run-image2-mcp.ps1",
            "tests/test-install-key-only.ps1",
            "tests/test-agent-bootstrap.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $path),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $messages = $errors | ForEach-Object { $_.Message }
              throw "PowerShell parser errors in ${path}: $($messages -join '; ')"
            }
          }
          Write-Host "PowerShell 5.1 parser review: OK"

      - name: Verify public GitHub TLS 1.2 request
        shell: powershell
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls

          function Enable-Image2Tls12 {
            [Net.ServicePointManager]::SecurityProtocol =
              [Net.ServicePointManager]::SecurityProtocol -bor [Net.SecurityProtocolType]::Tls12
          }

          Enable-Image2Tls12
          $protocols = [Net.ServicePointManager]::SecurityProtocol
          if (($protocols -band [Net.SecurityProtocolType]::Tls12) -eq 0) {
            throw "TLS 1.2 was not enabled"
          }
          if (($protocols -band [Net.SecurityProtocolType]::Tls) -eq 0) {
            throw "Existing TLS protocol flag was not preserved"
          }

          $response = Invoke-WebRequest -UseBasicParsing `
            -Headers @{ "User-Agent" = "image2-mcp-windows-review" } `
            -Uri "https://api.github.com/repos/Schyler0427/image2-mcp"
          if ($response.StatusCode -ne 200) {
            throw "GitHub metadata request returned HTTP $($response.StatusCode)"
          }
          $metadata = $response.Content | ConvertFrom-Json
          if ($metadata.full_name -cne "Schyler0427/image2-mcp") {
            throw "GitHub metadata response did not identify the expected public repository"
          }
          Write-Host "GitHub metadata TLS 1.2 probe: OK"

      - name: Run key-only installer suite
        shell: powershell
        timeout-minutes: 10
        run: ./tests/test-install-key-only.ps1

      - name: Run agent bootstrap suite
        shell: powershell
        timeout-minutes: 10
        run: ./tests/test-agent-bootstrap.ps1
