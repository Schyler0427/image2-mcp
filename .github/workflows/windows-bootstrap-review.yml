name: Windows bootstrap review validation

on:
  push:
    branches:
      - codex/agent-key-only-install

permissions:
  contents: read

jobs:
  windows-powershell-5-1:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse bootstrap fixture
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tests\test-agent-bootstrap.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors
            exit 1
          }
      - name: Run PowerShell bootstrap integration
        shell: powershell
        timeout-minutes: 1
        run: .\tests\test-agent-bootstrap.ps1
