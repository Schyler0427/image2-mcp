name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test Bash installers
        if: runner.os == 'Linux'
        run: |
          bash tests/test-install-key-only.sh
          bash tests/test-agent-install-contract.sh
          bash tests/test-agent-bootstrap.sh
      - name: Test Windows PowerShell 5.1 installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/test-install-key-only.ps1
          ./tests/test-agent-bootstrap.ps1
