name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test Go
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Test native macOS launcher
        if: runner.os == 'macOS'
        run: bash tests/test-macos-launcher.sh
      - name: Test Bash installers
        if: runner.os == 'Linux'
        run: |
          bash tests/test-install-key-only.sh
          bash tests/test-agent-install-contract.sh
          bash tests/test-agent-bootstrap.sh
          bash tests/test-offline-package.sh
          bash tests/test-offline-install.sh
          bash tests/test-universal-launcher.sh
      - name: Test generated universal launcher payloads
        if: runner.os == 'Linux'
        run: bash scripts/build-universal-windows-launcher.sh --output "$RUNNER_TEMP/universal-launcher"
      - name: Test Windows PowerShell 5.1 installers
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./tests/test-install-key-only.ps1
          ./tests/test-agent-bootstrap.ps1
          ./tests/test-offline-install.ps1
          ./tests/test-launcher-architecture.ps1
          ./tests/test-bootstrap-directory-move.ps1
