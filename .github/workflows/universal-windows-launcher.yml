name: Universal Windows launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build universal launcher
        shell: bash
        run: bash scripts/build-universal-windows-launcher.sh --output "$RUNNER_TEMP/universal-launcher"

      - name: Create and sign update manifest
        shell: bash
        env:
          LAUNCHER_UPDATE_PRIVATE_KEY_B64: ${{ secrets.IMAGE2_LAUNCHER_UPDATE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -z "$LAUNCHER_UPDATE_PRIVATE_KEY_B64" ]]; then
            echo 'No launcher signing key configured; skipping optional update manifest.'
            exit 0
          fi
          version="$(sed -n 's/^const serverVersion = "\([^"].*\)"/\1/p' cmd/image2-mcp/main.go)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag_version="${GITHUB_REF_NAME#v}"
            [[ "$version" == "$tag_version" ]] || { echo "tag/version mismatch: $tag_version vs $version" >&2; exit 1; }
            version="$tag_version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release version: $version" >&2; exit 1; }
          launcher="$RUNNER_TEMP/universal-launcher/SchylerAI-Image2-mcp.exe"
          size="$(stat -c '%s' "$launcher")"
          sha256="$(sha256sum "$launcher" | cut -d' ' -f1)"
          cat > "$RUNNER_TEMP/launcher-manifest-unsigned.json" <<EOF
          {"version":"$version","published_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","notes":"Universal Windows launcher release $version.","asset_url":"https://api.schyler.top/image2/releases/$version/SchylerAI-Image2-mcp.exe","sha256":"$sha256","size":$size,"signature":"","architectures":["386","amd64","arm64"]}
          EOF
          umask 077
          trap 'rm -f "$RUNNER_TEMP/launcher-signing-key.pem" "$RUNNER_TEMP/launcher-manifest-unsigned.json"' EXIT
          printf '%s' "$LAUNCHER_UPDATE_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/launcher-signing-key.pem"
          public_key="$(sed -n 's/^const UpdatePublicKeyBase64 = "\([^"]*\)"/\1/p' cmd/windows-launcher/update_public_key.go)"
          test -n "$public_key"
          go run ./scripts/sign-launcher-manifest.go \
            -key "$RUNNER_TEMP/launcher-signing-key.pem" \
            -public-key "$public_key" \
            -input "$RUNNER_TEMP/launcher-manifest-unsigned.json" \
            -output "$RUNNER_TEMP/universal-launcher/launcher.json"
          rm -f "$RUNNER_TEMP/launcher-signing-key.pem" "$RUNNER_TEMP/launcher-manifest-unsigned.json"

      - name: Save universal launcher artifacts
        uses: actions/upload-artifact@v4
        with:
          name: universal-windows-launcher
          path: ${{ runner.temp }}/universal-launcher/*
          if-no-files-found: error

      - name: Upload launcher release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ runner.temp }}/universal-launcher/SchylerAI-Image2-mcp.exe
            ${{ runner.temp }}/universal-launcher/SchylerAI-Image2-mcp.manifest.json
          fail_on_unmatched_files: true
